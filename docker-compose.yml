networks:
  metadata_service:
  repo_rangler_proxy:
    name: repo_rangler_proxy
    external: true

volumes:
  metadata_service:

services:
  metadata_service_nginx:
    container_name: reporangler_metadata_service_nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    networks:
      - repo_rangler_proxy
      - metadata_service
    volumes:
      - ./public:/www/public:ro
    environment:
      - VIRTUAL_HOST=metadata.reporangler.localhost
    depends_on:
      - metadata_service_phpfpm

  metadata_service_phpfpm:
    container_name: reporangler_metadata_service_phpfpm
    build:
      context: .
      dockerfile: docker/phpfpm/Dockerfile
    networks:
      - metadata_service
    volumes:
      - .:/www
      - ../lib-reporangler:/lib-reporangler:ro
    env_file:
      - .env
    depends_on:
      metadata_service_postgres:
        condition: service_healthy

  metadata_service_postgres:
    container_name: reporangler_metadata_service_postgres
    image: postgres:15-alpine
    ports:
      - "5431:5432"
    networks:
      - metadata_service
    volumes:
      - metadata_service:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metadata_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passwordshouldbeasecret}
      POSTGRES_DB: ${POSTGRES_DB:-metadata_service}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata_service"]
      interval: 5s
      timeout: 5s
      retries: 5
